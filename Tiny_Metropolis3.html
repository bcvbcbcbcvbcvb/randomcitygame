<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Metropolis</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf2;--panel:#fbfdff;--ink:#162433;--mut:#5d6d7c;--line:#c5d2dd;--acc:#2f6fdb;--good:#1f9d62;--warn:#d98a0b;--bad:#d6453d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a26;--panel:#1a2736;--ink:#e8f0f7;--mut:#8fa1b3;--line:#2f4157;--acc:#6ea8ff;--good:#45d28f;--warn:#f0b233;--bad:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a26;--panel:#1a2736;--ink:#e8f0f7;--mut:#8fa1b3;--line:#2f4157;--acc:#6ea8ff;--good:#45d28f;--warn:#f0b233;--bad:#ff7a70;color-scheme:dark}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;overflow-y:auto}
header{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:8px 14px}
#name{font:700 24px Fredoka,system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);width:min(62vw,300px);padding:0 2px;outline:none}
#name:focus{border-bottom-color:var(--acc)}
#goal{font-weight:600}
#info,#tip{color:var(--mut)}
#info{flex:1 1 220px}
#new{font:inherit;color:var(--mut);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
#stage{flex:1 1 0;min-height:min(62vh,560px);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{touch-action:none;border-radius:10px;box-shadow:0 0 0 3px var(--line);cursor:crosshair}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;max-width:90%;text-align:center}
footer{display:flex;flex-wrap:wrap;gap:10px 22px;padding:10px 14px;background:var(--panel);border-top:2px solid var(--line)}
#hud{width:250px}
.row{display:flex;gap:22px;align-items:flex-end}
.row small{display:block;color:var(--mut);font-size:12px}
.row b{font:700 30px/1 Fredoka,system-ui,sans-serif}
#hap{font-size:42px!important}
#inc{color:var(--good);font-weight:600;margin-left:4px;font-size:12px;font-style:normal}
#pop{margin:6px 0;color:var(--mut)}
#util{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;gap:14px}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11px;color:var(--mut)}
#bars i{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bars u{display:block;height:100%;background:var(--acc);transition:width .4s}
#side{flex:1 1 380px;display:flex;flex-direction:column;gap:6px}
#tb{display:flex;flex-wrap:wrap;gap:6px 16px}
.grp small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.bs{display:flex;flex-wrap:wrap;gap:4px}
.t{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 6px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;font-size:11px;line-height:1.25}
.t span{font-size:22px;line-height:1.1}
.t i{font-style:normal;color:var(--mut)}
.t.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.t.no{opacity:.45}
@media (max-width:640px){#hud{width:100%}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip{font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:12px;padding:2px 8px;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.bs:empty{display:block;border:2px dashed var(--line);border-radius:10px;padding:14px 18px;color:var(--mut);font-size:11px}
.bs:empty::after{content:"Nothing here yet"}
[hidden]{display:none!important}
#rot,#riv{font:inherit;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#adm.on{display:flex}
#adm .box{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px;width:min(92vw,320px);display:flex;flex-direction:column;gap:10px}
#adm input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-sizing:border-box}
#adm label{display:flex;flex-direction:column;gap:4px;color:var(--mut)}
#adm button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#adm .qr{display:flex;gap:6px}#adm .qr button{flex:1}
#a-msg{color:var(--mut);min-height:1em}
#exp{font:inherit;font-weight:600;color:var(--acc);background:none;border:1px solid var(--acc);border-radius:8px;padding:3px 10px;cursor:pointer}
#tod{display:flex;align-items:center;gap:6px}#tsl{width:96px;accent-color:var(--acc)}#clk{font-variant-numeric:tabular-nums;min-width:38px}#tpl{font:inherit;color:var(--mut);background:none;border:1px solid var(--line);border-radius:8px;padding:1px 8px;cursor:pointer}
</style>

<div id="adm"><div class="box">

<div id="a-lock"><input id="a-code" type="password" placeholder="Passcode" autocomplete="off"> <button id="a-go">Unlock</button></div>

<button id="a-set">Set money</button>

 if(money<EXP)return toast("Expanding costs $100,000. You have $"+Math.floor(money).toLocaleString()+".");
 const nw=W+6,nh=H+4,ng=Array(nw*nh).fill(0),n2=Array(nw*nh).fill(0),n3=Array(nw*nh).fill(0),n4=Array(nw*nh).fill(0);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){ng[y*nw+x]=g[y*W+x];n2[y*nw+x]=hw[y*W+x];n3[y*nw+x]=rv[y*W+x];n4[y*nw+x]=el[y*W+x]}
 money-=EXP;nex++;g=ng;hw=n2;rv=n3;el=n4;W=nw;H=nh;world();dirty=1;updExp();ui();save();toast("City expanded! Room to grow.")};

const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)},cl=h=>new THREE.Color(h),TC=cl(0),
RP=(q,u,o)=>{const k=u<q[1][0]?0:1,a=q[k],b=q[k+1],t=(u-a[0])/(b[0]-a[0]);return typeof a[1]=="number"?a[1]+(b[1]-a[1])*t:o.copy(a[1]).lerp(b[1],t)},
SK={s:[[0,cl(0x7d90cc)],[.45,cl(0xffb890)],[1,cl(0xffffff)]],g:[[0,cl(0x2a3552)],[.45,cl(0x6b5560)],[1,cl(0x7a8a99)]],i:[[0,.72],[.45,.55],[1,.75]],b:[[0,cl(0x0a1228)],[.45,cl(0xe88e68)],[1,cl(0xe88e68)]],a:[[0,1],[.45,.5],[1,0]]};
function sky(dt){
 if(AUTO&&!sdrag)TOD=(TOD+Math.min(dt,.1)*.2)%24;
 const a=(TOD-6)*Math.PI/12,sy=Math.sin(a),cx=Math.cos(a),u=Math.min(1,Math.max(0,(sy+.2)/.6)),sun=sy>=0;
 night=sm(.18,-.12,sy);
 L.position.set((sun?cx:-cx)*16+4,Math.max(Math.abs(sy),.12)*22+1,9);
 L.intensity=sun?.08+.72*sm(0,.45,sy):.08+.35*sm(0,.5,-sy);
 sun?L.color.set(0xff9a5a).lerp(TC.set(0xfff6e8),sm(0,.35,sy)):L.color.set(0x7f9cff);
 RP(SK.s,u,hem.color);RP(SK.g,u,hem.groundColor);hem.intensity=RP(SK.i,u);
 const A=RP(SK.a,u),c=RP(SK.b,u,TC);
 $("stage").style.background=A<.005?"":`color-mix(in srgb,rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0}) ${A*100}%,var(--bg))`;
 if(Math.abs(night-NL)>.002||LV!=LVd){NL=night;LVd=LV;LB.forEach(o=>{const e=o.m.userData.ec,v=Math.min(1,Math.max(0,(night-o.th)/.2))*LV;o.m.emissive.setRGB(e[0]*v,e[1]*v,e[2]*v)});BM.opacity=.8*night;BM.visible=night>.05;HM.opacity=.9*night*LV;HM.visible=night*LV>.05}
 const mm=Math.floor(TOD*60);if(mm!=lastMM){lastMM=mm;$("clk").textContent=String(mm/60|0).padStart(2,"0")+":"+String(mm%60).padStart(2,"0");$("ti").textContent=night>.6?"🌙":night>.15?(TOD<12?"🌅":"🌇"):"☀️";if(AUTO&&!sdrag)$("tsl").value=TOD}}
function draw(){
 if(ghostFor!==tool)setGhost();
 if(dirty){dirty=0;rebuild()}
 ctl.update();
 const dt=cd();sky(dt);SPN.forEach(q=>q.rotation.z-=dt*2);try{cars(dt)}catch(e){console.error(e)}hl.visible=!!hov;
 if(hov){const[x,y]=hov,t=T[tool],bd=!!proto[tool],w=t.w||1,h=t.h||1,ew=bd&&rot&1?h:w,eh=bd&&rot&1?w:h,occ=g[y*W+x];
  const red=tool=="bull"?occ:T[tool].k=="g"?(occ||hw[y*W+x]||rv[y*W+x]||money<cc(t)):tool=="lamp"?(isB(occ)&&occ)||hw[y*W+x]||money<cc(t):bd?(!fits(x,y,ew,eh)&&!(t.tint&&same(occ,tool)))||money<cc(t):(("wtv".includes(T[tool].k)?occ&&isB(occ):occ)||money<cc(t));
  hl.material.color.set(red?0xe03c3c:0xffffff);hl.scale.set(ew,1,eh);hl.position.set(wx(x)+(ew-1)/2,.09+E(y*W+x),wz(y)+(eh-1)/2);
  if(ghost){ghost.visible=tool=="lamp"||T[tool].k=="g"||!!fits(x,y,ew,eh);ghost.position.set(wx(x)+(ew-1)/2,E(y*W+x),wz(y)+(eh-1)/2);ghost.rotation.y=rot*D;if(tool=="lamp"){ghost.position.x+=FX[0]-.5;ghost.position.z+=FX[1]-.5}}}
 else if(ghost)ghost.visible=false;
 $("exp").style.opacity=nex<MX&&money>=EXP?1:.5;
 renderer.render(scene,cam)}

function fit(){const r=$("stage").getBoundingClientRect();
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(r.width,r.height);
 cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}

function save(){try{localStorage.setItem(K,JSON.stringify({n:$("name").value,m:money,p:pop,g,h:hw,r:rv,e:el,w:won,W,H,x:nex,B,u:nu,v:2,t:TOD,l:LP,f:FW,q:RVP,tr:TR}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.g&&d.g.length==(d.W||22)*(d.H||14)){W=d.W||22;H=d.H||14;hw=d.h&&d.h.length==W*H?d.h:Array(W*H).fill(0);rv=d.r&&d.r.length==W*H?d.r:Array(W*H).fill(0);el=d.e&&d.e.length==W*H?d.e:Array(W*H).fill(0);nex=d.x||0;$("name").value=d.n;if(typeof d.t=="number")TOD=d.t;FW=d.f===undefined||d.f?1:0;RVP=+d.q||0;LP=Array.isArray(d.l)?d.l:[];TR=Array.isArray(d.tr)?d.tr.filter(q=>q&&T[q.id]):[];money=d.m;pop=d.p;won=d.w;
 if(d.v==2){g=d.g;B=d.B||{};nu=d.u||1}
 else{g=d.g.map(v=>v&&v!="road"?0:v);B={};nu=1;d.g.forEach((v,i)=>{if(v&&v!="road"&&T[v]){const u=nu++;B[u]={id:v,x:i%W,y:i/W|0,r:0,w:1,h:1};g[i]=u}})}}}catch(e){}}

const ST={cl:["h1","h4","h2","h5","h3"],eu:["eu1","eu4","eu2","eu5","eu3"],us:["us1","us4","us2","us5","us3"],as:["as1","as4","as2","as5","as3"]};
function showStyle(s){document.querySelectorAll(".t[data-s]").forEach(b=>b.hidden=b.dataset.s!=s);document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.c==s))}
const CHIPS=`<div class="chips">${[["cl","🏠 Classic"],["eu","🏰 European"],["us","🗽 American"],["as","⛩️ Asian"]].map(([k,l])=>`<button class="chip" data-c="${k}">${l}</button>`).join("")}</div>`;
$("tb").innerHTML=GR.map(([n,ids])=>`<div class="grp"><small>${n}</small>${n=="Housing"?CHIPS:""}<div class="bs">${ids.map(id=>`<button class="t" data-t="${id}"${T[id].s?` data-s="${T[id].s}"`:""} title="${T[id].n}"><span>${T[id].e}</span><b>${T[id].n}</b><i>${T[id].k=="x"?"refund":"$"+T[id].c+("hfcpu".includes(T[id].k)?" · "+(T[id].w||1)+"×"+(T[id].h||1):"")}</i></button>`).join("")}</div></div>`).join("");
$("tb").onclick=e=>{const c=e.target.closest(".chip");
 if(c){const q=Object.values(ST).find(a=>a.includes(tool)),i=q?q.indexOf(tool):0;sel(ST[c.dataset.c][i]);return}
 const b=e.target.closest(".t");if(b)sel(b.dataset.t)};
showStyle("cl");
$("bars").innerHTML=["Jobs","Shops","Clean air","Homes","Fun","Power","Water"].map((n,i)=>`<div>${n}<i><u id="b${i}"></u></i></div>`).join("");
$("pc").oninput=e=>{pcol[tool]=e.target.value;ghostFor=null};
$("name").onfocus=e=>e.target.select();
$("name").oninput=()=>{save();ui()};
$("new").onclick=e=>{const b=e.target;
 if(b.dataset.s){B={};LP=[];TR=[];nu=1;g=Array(30*20).fill(0);hw=Array(30*20).fill(0);rv=Array(30*20).fill(0);el=Array(30*20).fill(0);W=30;H=20;nex=0;world();dirty=1;updExp();money=2000;pop=0;won=0;FW=1;RVP=0;$("name").value="My Little City";delete b.dataset.s;b.textContent="↺ New city";save();ui()}
 else{b.dataset.s=1;b.textContent="Click again to reset";setTimeout(()=>{delete b.dataset.s;b.textContent="↺ New city"},3000)}};
window.addEventListener("resize",fit);
const ADMIN_CODE="metro-admin";let adm=0,pen=0,penT;
const rotB=()=>{if(proto[tool])rot=(rot+1)&3};$("rot").onclick=rotB;
const am=t=>$("a-msg").textContent=t,aClose=()=>$("adm").classList.remove("on");
function admShow(){$("a-lock").hidden=!!adm;$("a-tools").hidden=!adm;if(adm)$("a-money").value=Math.floor(money)}
function admOpen(){$("adm").classList.add("on");am("");admShow();setTimeout(()=>$(adm?"a-money":"a-code").focus(),30)}
function admMoney(v){if(!isFinite(v)){am("Enter a number.");return}money=Math.max(0,Math.min(1e12,v));$("a-money").value=Math.floor(money);ui();save();am("Money is now $"+Math.floor(money).toLocaleString())}
$("a-go").onclick=()=>{if($("a-code").value==ADMIN_CODE){adm=1;$("a-code").value="";am("");admShow()}else{am("Wrong passcode.");$("a-code").select()}};
$("a-code").onkeydown=e=>{if(e.key=="Enter")$("a-go").onclick()};
$("a-set").onclick=()=>admMoney(parseFloat($("a-money").value));
$("a-money").onkeydown=e=>{if(e.key=="Enter")$("a-set").onclick()};
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>admMoney(money+ +b.dataset.add));
$("a-x").onclick=aClose;$("adm").onclick=e=>{if(e.target.id=="adm")aClose()};
$("pen").onclick=()=>{clearTimeout(penT);if(++pen>=5){pen=0;admOpen()}penT=setTimeout(()=>pen=0,2000)};
addEventListener("keydown",e=>{if(e.key=="Escape")aClose();if(e.target.tagName=="INPUT"||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key=="r"||e.key=="R")rotB();if(e.key=="`")admOpen()});
const tg=(id,lab,get,set)=>{const b=$(id),r=()=>b.textContent=lab+": "+(get()?"ON":"off");b.onclick=()=>{set(!get());r();ui();am(lab+(get()?" enabled (resets on reload).":" disabled."))};r()};
tg("a-free","Free building",()=>FREE,v=>FREE=v?1:0);tg("a-hl","Max happiness",()=>HL,v=>HL=v?1:0);
$("a-inc").textContent="Income speed: x1";$("a-inc").onclick=()=>{IM=IM==1?2:IM==2?5:IM==5?10:IM==10?50:1;$("a-inc").textContent="Income speed: x"+IM;ui();am("Income is now x"+IM+" (resets on reload).")};
$("a-zero").onclick=()=>admMoney(0);
$("riv").onclick=()=>{genRiver();dirty=1;save();toast("River generated! Roads and highways can cross it as bridges.")};
$("a-pop").onclick=()=>{pop=S.cap;ui();save();am("Homes filled to "+S.cap+".")};
$("a-exp").onclick=()=>{if(nex>=MX)return am("Already at max size.");money+=EXP;$("exp").onclick();$("a-money").value=Math.floor(money);am("City expanded for free.")};
$("tsl").oninput=e=>{TOD=+e.target.value;lastMM=-1};$("tsl").onpointerdown=()=>sdrag=1;addEventListener("pointerup",()=>sdrag=0);$("tpl").onclick=e=>{AUTO^=1;e.target.textContent=AUTO?"⏸":"▶"};
load();sel("road");init3d();fit();updExp();ui();toast("Right-drag or Shift-drag to rotate · scroll to zoom · arrow keys to pan",7000);
setInterval(tick,1000);
(function loop(){draw();requestAnimationFrame(loop)})();
</script></body></html>
