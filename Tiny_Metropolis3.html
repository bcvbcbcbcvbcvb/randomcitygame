<style>
:root{--bg:#e6edf2;--panel:#fbfdff;--ink:#162433;--mut:#5d6d7c;--line:#c5d2dd;--acc:#2f6fdb;--good:#1f9d62;--warn:#d98a0b;--bad:#d6453d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a26;--panel:#1a2736;--ink:#e8f0f7;--mut:#8fa1b3;--line:#2f4157;--acc:#6ea8ff;--good:#45d28f;--warn:#f0b233;--bad:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a26;--panel:#1a2736;--ink:#e8f0f7;--mut:#8fa1b3;--line:#2f4157;--acc:#6ea8ff;--good:#45d28f;--warn:#f0b233;--bad:#ff7a70;color-scheme:dark}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;overflow-y:auto}
header{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:8px 14px}
#name{font:700 24px Fredoka,system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);width:min(62vw,300px);padding:0 2px;outline:none}
#name:focus{border-bottom-color:var(--acc)}
#goal{font-weight:600}
#info,#tip{color:var(--mut)}
#info{flex:1 1 220px}
#new{font:inherit;color:var(--mut);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
#stage{flex:1 1 0;min-height:min(62vh,560px);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{touch-action:none;border-radius:10px;box-shadow:0 0 0 3px var(--line);cursor:crosshair}
#binfo{position:absolute;left:0;top:0;z-index:5;pointer-events:auto;min-width:190px;max-width:min(80%,260px);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px 10px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;font-size:13px}
#binfo.on{display:block}
#binfo .bt{font-weight:700;font-size:15px;margin:0 22px 6px 0}
#binfo .br{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
#binfo .br span:first-child{color:var(--mut)}
#binfo .br b{font-variant-numeric:tabular-nums}
#binfo .bn{color:var(--bad);font-weight:600;margin-top:4px}
#binfo .bx{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--mut);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;max-width:90%;text-align:center}
footer{display:flex;flex-wrap:wrap;gap:10px 22px;padding:10px 14px;background:var(--panel);border-top:2px solid var(--line)}
#hud{width:250px}
.row{display:flex;gap:22px;align-items:flex-end}
.row small{display:block;color:var(--mut);font-size:12px}
.row b{font:700 30px/1 Fredoka,system-ui,sans-serif}
#hap{font-size:42px!important}
#inc{color:var(--good);font-weight:600;margin-left:4px;font-size:12px;font-style:normal}
#pop{margin:6px 0;color:var(--mut)}
#util{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;gap:14px}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11px;color:var(--mut)}
#bars i{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bars u{display:block;height:100%;background:var(--acc);transition:width .4s}
#side{flex:1 1 380px;display:flex;flex-direction:column;gap:6px}
#tb{display:flex;flex-wrap:wrap;gap:6px 16px}
.grp small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.bs{display:flex;flex-wrap:wrap;gap:4px}
.t{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 6px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;font-size:11px;line-height:1.25}
.t span{font-size:22px;line-height:1.1}
.t i{font-style:normal;color:var(--mut)}
.t.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.t.no{opacity:.45}
@media (max-width:640px){#hud{width:100%}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip{font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:12px;padding:2px 8px;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.bs:empty{display:block;border:2px dashed var(--line);border-radius:10px;padding:14px 18px;color:var(--mut);font-size:11px}
.bs:empty::after{content:"Nothing here yet"}
[hidden]{display:none!important}
#rot,#riv,#biome{font:inherit;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#adm.on{display:flex}
#adm .box{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px;width:min(92vw,320px);display:flex;flex-direction:column;gap:10px}
#adm input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-sizing:border-box}
#adm label{display:flex;flex-direction:column;gap:4px;color:var(--mut)}
#adm button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#adm .qr{display:flex;gap:6px}#adm .qr button{flex:1}
#a-msg{color:var(--mut);min-height:1em}
#menub,#verb{font:inherit;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}#verb{font-size:12px;color:var(--mut)}#verb.new{color:var(--acc);border-color:var(--acc)}
#gnd,#exp{font:inherit;font-weight:600;color:var(--acc);background:none;border:1px solid var(--acc);border-radius:8px;padding:3px 10px;cursor:pointer}
#tod{display:flex;align-items:center;gap:6px}#tsl{width:96px;accent-color:var(--acc)}#clk{font-variant-numeric:tabular-nums;min-width:38px}#tpl{font:inherit;color:var(--mut);background:none;border:1px solid var(--line);border-radius:8px;padding:1px 8px;cursor:pointer}
#stage{min-height:min(38vh,320px)}
#tb{display:block}
.dk-panel{margin-bottom:6px;animation:dkin .18s ease-out}
@keyframes dkin{from{opacity:0;transform:translateY(6px)}}
.dk-subs{display:flex;gap:4px;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}
.dk-subs .chip{flex:none;font-size:12px;padding:4px 12px;white-space:nowrap}
.dk-items{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.dk-items .t{flex:none;width:88px;scroll-snap-align:start;text-align:center}
.dk-items .t b{font-weight:600}
.dk-cats{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--bg);border:2px solid var(--line);border-radius:14px}
.dk-c{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;border-radius:10px;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;line-height:1.15;text-align:center;cursor:pointer}
.dk-c span{font-size:24px;line-height:1.1}
.dk-c:hover{background:var(--panel);color:var(--ink)}
.dk-c.on{background:var(--acc);color:var(--bg)}
.dk-c:focus-visible,.dk-subs .chip:focus-visible,.dk-items .t:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dk-panel{animation:none}}
/* layout fixes: HUD wraps instead of overlapping, tool info stays compact */
#hud{width:auto;min-width:250px;max-width:100%}
.row{flex-wrap:wrap;gap:6px 22px}
.row b{white-space:nowrap}
#hap{font-size:36px!important}
#info{flex:1 1 220px;max-width:min(100%,440px);font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:help}
@media (max-width:640px){#hud{width:100%}}

function wheel(d){const o=g$("on-wh"),x=g$("on-wc").getContext("2d"),n=d.segs.length,a=2*Math.PI/n,F=2*Math.PI*6-(d.idx+.5)*a,t0=performance.now(),C=["#e6584d","#f2b632","#4fb36a","#3b8fd9","#9b59d0","#f08a3a","#2fb5a8","#d9559b"],P=Math.PI/2;
 o.hidden=false;g$("on-wr").textContent=d.win?"🎡 Picking a random player…":"🎡 Global wheel spin!";

 const step=t=>{const p=Math.min(1,(t-t0)/5500);draw(F*(1-Math.pow(1-p,3)));if(p<1)return requestAnimationFrame(step);const s=d.segs[d.idx];if(d.win){g$("on-wr").textContent=d.win==uid?"🎉 You won "+d.pl+"!":"🏆 "+d.wn+" won "+d.pl+"!"}else{if(s.v){money+=s.v;ui();save()}g$("on-wr").textContent=s.v?"You won "+s.l+"! 🎉":"No prize this time"}setTimeout(()=>o.hidden=true,4500)};requestAnimationFrame(step)}
function ga(d){const c=g$("on-ga");c.replaceChildren();if(!d||(d.status=="drawn"&&Date.now()-(d.drawnAt||0)>6e5)){c.hidden=true;return}c.hidden=false;
 if(d.status=="open"){c.append(mkE("span","🎁 "+d.title+" · win $"+d.amount.toLocaleString()));const b=mkE("button",S0.e==d.id?"Entered ✓":me?"Enter":"Sign up to enter");b.disabled=S0.e==d.id||!me;

 else{c.append(mkE("span","🏆 "+d.winnerName+" won “"+d.title+"”"));if(d.winner&&d.winner==uid&&S0.c!=d.id){S0.c=d.id;put();money+=d.amount;ui();save();banner("🎉 You won the giveaway: $"+d.amount.toLocaleString()+"!",9000)}}}

 if(await w("events/giveaway",{status:"drawn",winner:k?k.id:null,winnerName:k?k.name:"Nobody (no entries)",drawnAt:Date.now()},1))st(k?"Winner: "+k.name:"No entries.")}catch(e){st("Draw failed.")}};

<script>
(function(){
const VER="1.36.0",
LOG=[
["1.36.0","One-way streets",["Two new tools at the end of the Roads tab: ➡️ One-way street ($8 a tile) and ↔️ Two-way street (free).","Drag along a road in the direction cars should drive and it turns into a one-way street with arrows painted on it. You can also click a road to make it one-way, click again to flip the direction, and once more to make it two-way again. It works on regular roads and dirt roads.","Cars follow the arrows: they only leave a one-way street the way it points, they can’t turn onto one against its direction, and they drive down the middle of the road.","One-way streets are saved with your city, survive map expansions and undo/redo, and work when other mayors visit your city."],"Nov 11, 2026"],
["1.35.0","Building creator upgrades",["Undo and redo in the Building creator: use the ↶ ↷ buttons or Ctrl+Z and Ctrl+Y. Press Delete to remove the selected part.","3 new part shapes: Gable roof (a ridge roof for houses), Dome and Sphere, next to Block, Windows, Cylinder, Cone, Pyramid roof and Neon glow. Every part can now be turned in 15° steps, and buildings can hold up to 60 parts.","Quick color swatches for each part, plus 📍 Center and ⬆ Stack on previous buttons to line parts up fast. Mirror also flips the part's turn.","Choose a base for your building: none, a grass pad, a stone pad or a sand pad.","The 3D preview now zooms with the mouse wheel, and a 🌙 Night button shows how your windows and neon glow will look after dark.","New templates: Gable house, Neon tower and Domed hall, next to Cottage, Glass tower, Pagoda and Shop.","📤 Share code gives you a code for any building, and 📥 Load code opens a friend's building so you can edit it and save your own copy."],"Nov 11, 2026"],
["1.34.0","Custom building creator",["New 🛠️ Custom tab in the build dock. Press ➕ Creator to open the Building creator, where you design your own buildings and then place them in your city.","Build the shape from up to 40 parts: Blocks, Windows (lit at night), Cylinders, Cones, Roofs, Spheres and Neon glow. Pick each part's color, size and position with sliders, and copy or mirror parts to build faster. Start from a template (Cottage, Glass tower, Pagoda or Shop) if you like.","A live 3D preview spins as you build. Drag it to turn the building around.","Choose what it is: Housing, Commerce or Park / fun, a 1×1 or 2×2 footprint, and a level from 1 to 10. Higher levels hold more people or give more jobs and income, and cost more. The cost and stats are shown while you design.","Your buildings appear in 🛠️ Custom → My buildings. You can edit or delete them any time, and edits update buildings already in your city.","Custom buildings are saved with your city, so they show up when other mayors visit it and when you load it on another device."],"Nov 11, 2026"],
["1.33.0","Asian skyscrapers",["6 new tall homes at the end of the Asian housing tab: Jade Pagoda Tower ($5,200), Twin Dragon Towers ($12,000, 2×2), Lantern Tower ($4,800), Pearl Spire ($5,600), Neon Megablock ($4,400) and Sakura Sky Terraces ($4,600).","Jade Pagoda Tower is eight stacked pagoda tiers with red eaves and a golden spire. Twin Dragon Towers is a 2×2 pair of towers with sky bridges and a gold dragon curled on the podium. Lantern Tower glows with red lantern bands and a giant lantern on top.","Pearl Spire is a glowing sphere tower on three legs. Neon Megablock is covered in neon signs, rooftop tanks and aerials. Sakura Sky Terraces has cherry blossoms on every level and counts toward the Global Goals.","Twin Dragon Towers holds 150 people and adds +3 city pride. Jade Pagoda Tower and Pearl Spire also add a little pride."],"Nov 10, 2026"],
["1.32.0","Admin: random player wheel & gifts",["The 🔧 Admin panel's global wheel now picks a random player. The slices are player names, and you choose whether to pick from all players or only giveaway entrants. Everyone sees the same spin and the winner gets the prize when it stops.","New 🎁 Prize setting: choose Money (type any amount) or Senators (1 to 5 seats, with random, Regular, Epic, Mythical, Legendary or Secret rarity). The same prize is used by the wheel and by gifts.","New 🎯 Give to a specific player: load the player list, pick someone and give them the prize straight away. They receive it the next time they are online, even if they were away when you sent it.","Gifted senators fill empty seats first. If all 5 seats are full, a rarer senator replaces the weakest one, otherwise the player is told their Senate is already full of better senators.","The old money-only wheel and its list of prize amounts are gone. Announcements and the entry-based giveaway still work."],"Nov 10, 2026"],
["1.31.0","Railway level crossings",["Lay a Railway across a straight road (or a road across a railway) and the tile becomes a level crossing with gates and flashing lights.","When a train gets close, the lights flash, the gates come down and cars stop and queue before the crossing. When the train has passed, the gates lift and traffic moves again.","Trains run straight through crossings. Bulldoze a crossing to remove it. Crossings only work on straight stretches, not at junctions or dead ends."],"Nov 10, 2026"],
["1.30.0","Building info, random terrain & city visits",["With No tool selected, click any building to see a pop-up above it with its name, how much ⚡ energy it uses and how much 💧 water it uses. It follows the building as you move the camera and updates live. Power and water buildings also show how much they produce, and a building with no road shows that it isn’t running yet.","New 🌍 Random terrain button in the top bar, next to Generate river. It paints the whole map into big biomes (grass, sand, desert, autumn, snow and rock), turns land beside water into beaches, raises hills up to 3 levels like the Raise land tool, and adds a few matching trees. Buildings, roads, highways and water are never moved. Press Ctrl+Z to undo it. It replaces any ground or hills you painted by hand on empty land.","Click any mayor in the 🏆 leaderboard to look around their city in view-only mode: you can move the camera and click buildings, but you can’t build or change anything. A bar at the top has a ← Back to my city button, and your own city, score and cloud save are never touched. The other mayor needs to be signed in and synced to the cloud.","Fixed the pile-up of cars after a highway merges into a road: there are fewer highway cars, and only some of them continue onto the street."],"Nov 10, 2026"],
["1.29.0","Undo & redo",["Press Ctrl+Z (or ⌘Z) to undo your last build, paint, bulldoze or terrain stroke, and Ctrl+Y or Ctrl+Shift+Z to redo. A drag counts as one step, up to 40 steps. Money spent is refunded on undo.","New ↶ ↷ buttons in the bottom-left of the map for touch screens. History clears when you expand the city or start a new one."],"Nov 8, 2026"],
["1.28.0","Tile-by-tile ground",["Ground is now painted tile by tile. In Terrain & Trees → 🎨 Paint ground, pick a material and click or drag over just the tiles you want. Grass erases paint. The old whole-map ground button is gone."],"Nov 8, 2026"],
["1.27.0","Ground picker in Terrain",["New 🎨 Ground section in the Terrain & Trees tab: click Grass, Sand, Desert, Autumn, Snow or Rock to switch the ground right away, no more cycling through them. The current ground is highlighted, and the 🌱 button in the top bar still works too."],"Nov 8, 2026"],
["1.26.0","Car dealerships",["New 🚗 Auto section in the Commerce tab with 4 dealerships: Used Car Lot ($900), Car Dealership ($3,200), EV Dealership ($4,500, counts toward the Global Goals) and Luxury Motors Showroom ($12,000, 2×2).","Each one adds jobs, income and services, and the bigger ones get more of each. The Luxury Showroom also adds a little happiness."],"Nov 8, 2026"],
["1.25.0","Cobblestone streets",["New 🪨 Cobblestone street in the Roads tab ($6 a tile): a wide stone-paved street for walking. Pedestrians stroll along it, cars don't drive on it, and buildings that touch it still count as connected.","Cobblestone joins up with roads, dirt roads and footpaths, and curves at corners like the other streets."],"Nov 8, 2026"],
["1.24.1","Pricier skyscrapers",["All skyscrapers now cost twice as much, including the older tall towers (Skyline Residences, Glass Spire, Art Deco and Glass Skyscrapers, Twin Towers, Setback Highrise, Neon Heights, Stalinist and Brutalist Towers) and the new ones, plus the two office towers. Their capacity and income are unchanged, so they now take longer to pay back."],"Nov 8, 2026"],
["1.24.0","Vets & 8 Spruce Street",["New 🎖️ Veterans Hospital in the Health tab ($8,000, 2×2): lots of health coverage plus +2 city pride.","New 🐾 Vet Clinic in the Health tab ($1,200): some health coverage, services and happiness for pet owners.","New 🏙️ 8 Spruce Street at the end of the American housing tab ($4,200): the rippling steel New York tower, holding 110 people and adding +3 city pride."],"Nov 8, 2026"],
["1.23.0","Metro, Observation Tower & Sky Park",["New 🚇 Metro Station in the Railway tab ($3,800): a big boost to services that suits dense, tall districts. Counts toward the Global Goals.","New 🔭 Observation Tower in the Recreation tab ($7,000): a tall viewing tower that adds fun, income and +4 city pride.","New 🌳 Sky Park in the Recreation tab ($1,500): a raised garden with trees and a pond that freshens the air nearby. Counts toward the Global Goals."],"Nov 8, 2026"],
["1.22.0","Skyscrapers",["9 new tall homes, added to the end of their housing tabs: Spire Residences (Classic), Gothic Tower Block (European), Supertall Condos and Pencil Tower (American), Bamboo Sky Garden (Asian), Twisting Tower and Arcology (Modern), Lotus Tower (Tropical) and Minaret Twin Towers (Mediterranean).","The Arcology is a 2×2 mega-block that holds 210 people. Bamboo Sky Garden and Arcology also count toward the Global Goals.","2 new office towers in the Commerce tab: the Financial Tower (1×1) and the Business Plaza Towers (2×2), with lots of jobs and income."],"Nov 8, 2026"],
["1.21.0","Military & city pride",["New 🎖️ Pride stat. Military buildings and every landmark now boost city pride, which adds happiness and income. Pride shows in the top bar once you have some, and it has diminishing returns, capping at +15%.","New 🎖️ Military tab under Public Safety: Army Barracks, War Memorial, Parade Ground, Military Academy and Air Force Base.","Landmarks now add pride too: the Statue of Liberty gives +2 and the biggest landmark gives +10."],"Nov 8, 2026"],
["1.20.0","More housing & Night Market",["14 new homes in two new Housing tabs. 🏙️ Modern: Tiny House, Container Homes, Modern Villa, Co-living Block, Passive Townhouses, Terrace Gardens and Glass Residences. 🌺 Tropical: Stilt House, Beach Bungalow, Teak Pavilion Villa, Longhouse Row, Palm Condos, Resort Villas and Seaview Tower.","Homes range from $90 (Tiny House, room for 3) to $1,650 (Glass Residences, room for 58). Tiny House, Container Homes, Co-living Block, Passive Townhouses and Terrace Gardens also count toward the Global Goals.","New 🏮 Night Market in the Commerce tab ($900): street-food stalls with glowing lights that add jobs, income and a big boost to services."],"Nov 8, 2026"],
["1.19.0","Global Goals (UN SDGs)",["New 🌍 SDGs button in the top bar: a dashboard that scores your city from 0 to 100 on all 17 UN Sustainable Development Goals. Reach 80 on a goal to achieve it: $5,000 once, plus +1.2% income and +0.6% happiness for every goal you hold. All 17 unlocks Agenda 2030: $250,000 and extra bonuses.","New 🌍 Global Goals build tab with 33 buildings and 3 plants: Social Housing, Food Bank, Job Training Center, Childcare Center, Women’s Enterprise Hub, Wellbeing Center, Community Center, Community Garden, Farmers Market, Vertical Farm, Wastewater Recycling, Public Fountain, Battery Storage, Biogas Plant, Community Solar Co-op, EV Charging Station, Carbon Capture Plant, Composting Facility, Repair Café, Eco Apartments, Wildlife Reserve, Wetland Reserve, Tree Nursery, Marine Research Station, Co-working Hub, Innovation Lab, Fibre Internet Hub, Bus Interchange, Bike Share Hub, Legal Aid Office, Open Government Hall, NGO Partnership Center, Global Summit Hall, plus Mangrove, Bamboo and Wildflower Meadow.","Many existing buildings (hospitals, schools, wind and solar, water plants, parks, police and more) now also count toward the goals.","The Daily news has an SDG progress line, and the info bar shows which goals a building supports."],"Nov 8, 2026"],
["1.18.0","Protests & riots",["Unhappy citizens now protest. A crowd with signs appears on the map next to the building they are angry about: the Town Hall for jobs, crime, schools, taxes and budget cuts, a power plant for blackouts, a water plant for shortages, factories for smog, or homes for the rest. A floating label says why.","If a protest isn't fixed in 3 days it turns into a riot: flames, a red zone, damage every day and −3% income and happiness per riot.","Fix the cause and the protest ends by itself. The City hub has an Unrest list with the location, reason and how to fix it, and you can send police ($1,500) if you have a Police Station.","Tax Hike laws and budget cuts can also cause protests. New protests and riots appear in the Daily news."],"Nov 8, 2026"],
["1.17.0","Rival cities replace disasters",["Disasters and emergency votes are gone.","New 🏁 Regional rankings in the City hub: three rival cities grow every day and you are ranked against them by population. Weekly prizes: #1 $15,000, #2 $5,000, #3 $1,500.","Being #1 makes you the Regional Capital: +4% income and +2% happiness while you stay on top.","Sign trade deals with rivals ($8,000, or $4,000 with the Diplomacy tech, 10 days, max 2) for +4% income each. Rivals speed up if you run far ahead, so the race stays tight.","Rank changes and weekly prizes show in the Daily news."],"Nov 8, 2026"],
["1.16.0","City hub: research, leagues, citizens & budget",["New 🏙️ City hub button in the top bar with five new systems.","Research: 5 techs that take days to finish and boost income, happiness or trade deals.","Sports leagues: every 10 games your team goes to the playoffs. A title gives $20,000 and a parade.","Citizen stories: three named citizens whose lives follow your city. Happy ones donate, unhappy ones leave.","Budget sliders for police, health and education, plus loans with 2% daily interest."],"Nov 8, 2026"],
["1.15.0","Senator elections & scandals",["Election Day every 7 days of Daily news: each senator's approval from Senate watch decides whether they are re-elected. Unpopular senators are voted out and their seat becomes vacant.","Random scandals: a senator can get caught up in one. Open the City Senate to defend them for $5,000 or fire them. Ignore it and they take a big hit on Election Day.","The City Senate shows a countdown to the next election, and Election Day results and scandals appear in the Daily news."],"Nov 8, 2026"],
["1.14.1","Easier to find Laws",["New glowing 📜 Laws button in the top bar, so you can reach Senate Laws without opening the Senate first.","The Laws button inside the City Senate is now bigger, brighter and sits at the top."],"Nov 8, 2026"],
["1.14.0","Senate Laws",["New 📜 Senate Laws button inside the City Senate (click your Town Hall or Capitol with ✋ No tool selected). Propose laws and your elected senators vote on them.","Five laws: Tax Hike, Green Deal, Free Trade Act, City Festival Season and Building Boom. Each one changes your income and happiness, and only 2 can be in force at once, so you have to pick a strategy.","Every senator votes by their trait (Fiscal hawk, Master builder, Green champion, Free-trade fan, Silver-tongued orator, Budget wizard). Rarer senators carry more weight, and a Secret senator always votes yes.","A failed bill still costs you half the lobbying fee. Laws in force show up in the Senate watch of the Daily news."],"Nov 8, 2026"],
["1.13.0","Derbies & double-header stadiums",["Fixed: building two or more stadiums of the same type (like two Football Stadiums) no longer gets ignored. Every connected stadium now hosts its own game.","Each stadium has its own team, with its own season record, and its own crowd.","Derby days: two stadiums of the same sport can have their teams play each other (sold-out crowds, 🔥 city split, DERBY tag in the Sports desk).","Otherwise both teams play at the same time against outside opponents. A stadium with no road is postponed on its own, without stopping the others."],"Nov 8, 2026"],
["1.12.0","Senate watch uses your real senators",["Senate watch in the Daily news shows the thoughts of the senators you actually elected in the City Senate.","Citizens react to each senator's trait (Fiscal hawk, Master builder, Green champion and so on) and give an approval rating. Rarer senators get a little more love, and Secret senators are a mystery.","No senators yet? The news tells you to elect one at your Town Hall or Capitol."],"Nov 8, 2026"],
["1.10.0","Daily news & stadium scores",["New 📰 News button in the top bar: a new Daily edition comes out every morning at sunrise, with a red dot when there's something unread. The last 7 editions are kept so you can look back.","Each edition has a headline, happy citizens, mayor approval, population and income with day-to-day changes, plus Street talk quotes from citizens and a What citizens think bar chart.","New Sports desk with live stadium scores: build a Football Stadium, Basketball Arena, Hockey Arena or Baseball Stadium and your home team plays every day, with the score, a win/loss/draw tag, the crowd size and the season record. The venue needs a road connection or the game is postponed.","Your racing circuit and Concert Stage also make the news: Grand Prix winners and who played the stage."],"Nov 8, 2026"],
["1.9.0","Toll booths & concert music",["New Toll Booth (Roads tab): click a straight stretch of highway to build a toll gantry. Every car that drives through pays $5 and slows down a little.","Concert Stage is now smaller (2×2) and cheaper ($9,000).","With ✋ No tool selected, click a Concert Stage to open a music player. The Built-in beats tab has four original instrumentals (two rage-trap style, two moody late-night style) made live in your browser: no files needed.","The two rage-trap beats are now much heavier: stacked synth leads, hard chord stabs, distorted 808s, crashes and risers. New Calm & relaxing tab with four soft original pieces: Slow Tide, Paper Lanterns, Quiet Rain and Morning Garden.","You can also add your own mp3 files under the Ken Carson and Drake tabs. Those are saved in your browser only. Music keeps playing after you close the player."],"Nov 8, 2026"],
["1.8.0","Concert stage & bridge fixes",["New Concert Stage (3×3) in Recreation: big screen, speakers, glowing stage lights and a crowd. Lights up at night.","Fixed: expanding your city no longer resets bridges and elevated roads back to normal roads.","Fixed: bulldozing a bridge or elevated road now restores the original terrain instead of leaving random raised land or raised water behind."],"Nov 7, 2026"],
["1.7.0","Race circuits",["New Motorsport section: Race Track, Grandstand and Pit Garage.","Drag to lay a circuit; tiles join up and curve on their own. Build a loop and race cars start racing around it.","Race cars use both sides of the track and speed through the corners."],"Nov 7, 2026"],
["1.6.0","Main menu & update log",["New main menu: continue, new city, save slots and this update log.","Version badge in the top bar so you can tell which update you're on."],"Nov 7, 2026"],
["1.5.0","More industry",["Greenhouse Farm, Brewery, Textile Mill, Data Center, Chemical Plant, Steel Mill, Oil Refinery and Auto Factory."],"Nov 7, 2026"],
["1.4.0","More energy",["Wind Farm, Solar Array, Gas Power Plant, Geothermal Plant and Nuclear Plant."],"Nov 7, 2026"],
["1.3.0","Mediterranean / N. Africa + ground picker",["New Mediterranean / N. Africa housing tab: Riad House, Blue-Wash House, Kasbah, Medina Row, Domed Villa, Souk Flats, Marrakech Tower.","Ground button in the top bar: grass, sand, desert, autumn, snow or rock."],"Nov 7, 2026"],
["1.2.0","Soviet / brutalist housing",["New Soviet housing tab: Dacha, Khrushchyovka, Panel Tower, Brutalist Slab, Stalinist Tower, Microdistrict, Brutalist Tower."],"Nov 7, 2026"],
["1.1.0","Schools & more housing",["Education split into Library, Elementary School, Secondary School, High School and University.","Three new homes for each of the Classic, European, American and Asian styles."],"Nov 7, 2026"],
["1.0.0","Base game",["Roads, housing, power and water, rivers, map expansions and landmarks."],"Nov 7, 2026"]],
q=id=>document.getElementById(id),

window.MENU=1;
const vb=q("verb");vb.textContent="v"+VER;

 b.append(mk("h3","📜 Update log"));
 const c=mk("div",null,"ul-cur");c.append("You're on version ");c.append(Object.assign(mk("b","v"+VER)));c.append(" (the newest in this file).");b.append(c);
 LOG.forEach(([v,t,ls,dt],i)=>{const d=mk("div",null,"ul-v"),h=mk("b","v"+v+" — "+t);if(i==0)h.append(mk("i","NEW"));d.append(h);if(dt){const e=mk("small",dt);e.style.cssText="display:block;color:var(--mut);font-weight:400;margin:1px 0 3px";d.append(e)}const u=mk("ul");ls.forEach(l=>u.append(mk("li",l)));d.append(u);b.append(d)});
 const x=mk("button","Close");x.onclick=closeLog;b.append(x);
 q("ul").classList.add("on");try{localStorage.setItem("tm_seen",VER)}catch(e){}upd();if(window.MENU)menu()}

q("ul").onclick=e=>{if(e.target.id=="ul")closeLog()};
vb.onclick=openLog;
function slotsView(){
 const b=q("mm-box");b.replaceChildren();
 b.append(mk("div","💾 Save slots","mm-t"),mk("div","Each slot is its own city. Switching reloads the page.","mm-s"));
 const w=mk("div",null,"mm-sl");
 [1,2,3].forEach(n=>{let d=null;try{d=JSON.parse(localStorage.getItem(ek(n)))}catch(e){}
  const used=!!(d&&d.g&&d.g.some(Boolean)),bt=mk("button",null,n==SLOT?"cur":"");
  bt.append("Slot "+n+(n==SLOT?" — playing":""));bt.append(Object.assign(mk("small",used?(d.n||"My city")+" · 👥 "+Math.floor(d.p||0)+" · $"+Math.floor(d.m||0).toLocaleString():"Empty — start a new city")));
  bt.onclick=()=>{if(n==SLOT){closeMenu();return}try{save()}catch(e){}try{localStorage.setItem("tm_slot",n)}catch(e){}location.reload()};w.append(bt)});
 b.append(w);const x=mk("button","← Back","mm-b");x.onclick=menu;b.append(x)}
function menu(){
 window.MENU=1;try{save()}catch(e){}
 const b=q("mm-box");b.replaceChildren();
 const has=Object.keys(B).length>0;
 b.append(mk("div","🏙️ Tiny Metropolis","mm-t"),mk("div","Build roads, homes, power and water — and grow your city.","mm-s"));
 const pl=mk("button",has?"▶ Continue":"▶ Start building","mm-b pri");if(has){pl.append(mk("small",q("name").value+" · 👥 "+Math.floor(pop)))}pl.onclick=closeMenu;
 const nc=mk("button","🆕 New city","mm-b");nc.onclick=()=>{if(!confirm("Start a new city in slot "+SLOT+"? This erases the current city in this slot."))return;const n=q("new");n.click();n.click();closeMenu()};
 const sl=mk("button","💾 Save slots","mm-b");sl.append(mk("small","slot "+SLOT));sl.onclick=slotsView;
 const lg=mk("button","📜 Update log","mm-b");if(sv()!==VER)lg.append(mk("small","● NEW"));lg.onclick=openLog;
 b.append(pl,nc,sl,lg,mk("div","Version "+VER,"mm-v"));
 q("mm").classList.add("on")}
function closeMenu(){window.MENU=0;q("mm").classList.remove("on")}
q("menub").onclick=menu;
addEventListener("keydown",e=>{if(e.key!="Escape")return;if(q("ul").classList.contains("on"))closeLog();else if(window.MENU)closeMenu()},true);
menu();

<script>
/* Original instrumentals, synthesized live with Web Audio. No samples, no lyrics. */
window.TMB=(()=>{
const NF=n=>440*Math.pow(2,(n-69)/12),SC={min:[0,2,3,5,7,8,10],phr:[0,1,3,5,7,8,10],dor:[0,2,3,5,7,9,10],maj:[0,2,4,5,7,9,11]},
rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},
TR=[
 {cat:"beat",name:"Rage Mode",tag:"heavy rage trap, 156 BPM",bpm:156,root:54,sc:"min",prog:[0,5,2,6],st:"rage",seed:7,vol:.3},
 {cat:"beat",name:"Neon Static",tag:"heavy rage trap, 148 BPM",bpm:148,root:57,sc:"phr",prog:[0,5,6,4],st:"rage2",seed:19,vol:.3},
 {cat:"beat",name:"Midnight Drive",tag:"moody trap, 72 BPM",bpm:72,root:50,sc:"min",prog:[0,5,2,6],st:"moody",seed:21},
 {cat:"beat",name:"Cold Lights",tag:"late-night trap, 68 BPM",bpm:68,root:53,sc:"dor",prog:[0,3,5,4],st:"moody2",seed:33},
 {cat:"calm",name:"Slow Tide",tag:"ambient, 58 BPM",bpm:58,root:55,sc:"maj",prog:[0,5,3,4],st:"calm1",seed:41,vol:.5},
 {cat:"calm",name:"Paper Lanterns",tag:"lo-fi chill, 76 BPM",bpm:76,root:52,sc:"maj",prog:[0,5,1,4],st:"calm2",seed:52,vol:.5},
 {cat:"calm",name:"Quiet Rain",tag:"rainy ambient, 54 BPM",bpm:54,root:50,sc:"dor",prog:[0,3,0,6],st:"calm3",seed:63,vol:.5},
 {cat:"calm",name:"Morning Garden",tag:"soft acoustic, 66 BPM",bpm:66,root:57,sc:"maj",prog:[0,4,5,3],st:"calm4",seed:74,vol:.5}];
let cx=null,bus=null,nb=null,timer=0,on=0,idx=-1,pat=null,step=0,nt=0;const cv={};
const sd=(c,i)=>{const L=SC[c.sc],k=L.length;return c.root+L[((i%k)+k)%k]+12*Math.floor(i/k)};
const curve=k=>cv[k]||(cv[k]=(()=>{const a=new Float32Array(256);for(let i=0;i<256;i++)a[i]=Math.tanh(k*(i/128-1));return a})());
const env=(g,t,a,d,v)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)},
snd=(n,amt)=>{const g=cx.createGain();g.gain.value=amt;n.connect(g);g.connect(bus.d)},
O=(ty,f,t,dur,det,dst)=>{const o=cx.createOscillator();o.type=ty;o.frequency.setValueAtTime(f,t);o.detune.value=det||0;o.connect(dst);o.start(t);o.stop(t+dur);return o},
G=v=>{const g=cx.createGain();g.gain.value=v;return g},
noise=(t,dur,ty,f,q,v,d,send)=>{const s=cx.createBufferSource();s.buffer=nb;const b=cx.createBiquadFilter();b.type=ty;b.frequency.value=f;b.Q.value=q;const g=cx.createGain();env(g,t,.001,d,v);s.connect(b);b.connect(g);g.connect(bus.m);if(send)snd(g,send);s.start(t,Math.random()*.4);s.stop(t+dur)},
kick=(t,v)=>{const o=cx.createOscillator(),g=cx.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(44,t+.11);env(g,t,.002,.3,v);o.connect(g);g.connect(bus.m);o.start(t);o.stop(t+.45)},
sub=(t,m,len,v,dist,sl)=>{const g=cx.createGain(),ws=cx.createWaveShaper(),f=NF(m),o=cx.createOscillator();ws.curve=curve(dist||1.6);env(g,t,.006,len,v);o.type="sine";o.frequency.setValueAtTime(sl?NF(m+sl):f,t);o.frequency.exponentialRampToValueAtTime(f,t+.07);o.connect(g);o.start(t);o.stop(t+len+.1);const h=G(.12);O("triangle",f*2,t,len+.1,0,h);h.connect(g);g.connect(ws);ws.connect(bus.m)},
clap=(t,v)=>{[0,.011,.022].forEach(o=>noise(t+o,.08,"bandpass",1700,.9,v*.6,.05,0));noise(t+.03,.35,"bandpass",1500,.7,v*.7,.22,.3)},
hat=(t,v,op)=>noise(t,op?.3:.09,"highpass",7500,.4,v*.5,op?.14:.03,0),
lead=(t,m,len,v)=>{const f=NF(m),fl=cx.createBiquadFilter(),g=cx.createGain(),ws=cx.createWaveShaper();fl.type="lowpass";fl.frequency.setValueAtTime(5200,t);fl.frequency.exponentialRampToValueAtTime(1400,t+len);fl.Q.value=3;ws.curve=curve(9);env(g,t,.004,len,v);[["sawtooth",-14],["sawtooth",-5],["sawtooth",5],["sawtooth",14],["square",0]].forEach(([ty,d])=>O(ty,f,t,len+.1,d,fl));fl.connect(ws);ws.connect(g);g.connect(bus.m);snd(g,.18)},
stab=(t,ms,len,v)=>{const fl=cx.createBiquadFilter(),g=cx.createGain(),ws=cx.createWaveShaper();fl.type="lowpass";fl.frequency.setValueAtTime(4200,t);fl.frequency.exponentialRampToValueAtTime(900,t+len);fl.Q.value=2;ws.curve=curve(6);env(g,t,.002,len,v);ms.forEach(m=>{const f=NF(m);O("sawtooth",f,t,len+.1,-9,fl);O("sawtooth",f,t,len+.1,9,fl)});fl.connect(ws);ws.connect(g);g.connect(bus.m);snd(g,.12)},
crash=(t,v)=>noise(t,1.6,"highpass",4200,.3,v,1.4,.25),
riser=(t,len,v)=>{const s=cx.createBufferSource();s.buffer=nb;const b=cx.createBiquadFilter(),g=cx.createGain();b.type="bandpass";b.Q.value=1.2;b.frequency.setValueAtTime(300,t);b.frequency.exponentialRampToValueAtTime(9000,t+len);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+len);g.gain.linearRampToValueAtTime(.0001,t+len+.05);s.connect(b);b.connect(g);g.connect(bus.m);s.start(t,Math.random()*.4);s.stop(t+len+.1)},

calc=function(){const s=calc0();try{SD.sc=score(s);SD.n=SD.sc.filter((v,k)=>k&&v>=80).length;const f=fac(SD.n);s.hap=Math.min(1,s.hap*f.h);s.inc*=f.i}catch(e){console.error(e)}return s};
const bt=el("button","🌍 SDGs");bt.id="sdgb";bt.title="UN Sustainable Development Goals";
const lbl=()=>bt.textContent="🌍 SDGs "+SD.n+"/17";
function chk(){if(window.MENU||pop<1)return;let ch=0;
 SD.sc.forEach((v,k)=>{if(k&&v>=80&&!SG.got.includes(k)){SG.got.push(k);money+=5000;ch=1;toast("🌍 SDG "+k+" achieved: "+GO[k-1][0]+"! +$5,000",5000)}});
 if(SD.n>=17&&!SG.all){SG.all=1;money+=250000;ch=1;toast("🏆 Agenda 2030 complete! All 17 Global Goals achieved. +$250,000",8000)}
 if(ch){svg();ui();save()}}
setInterval(()=>{readDL();chk();lbl()},4000);
const help=k=>Object.keys(T).filter(id=>T[id].sdg&&T[id].sdg.includes(k)).sort((x,y)=>(T[y].nw?1:0)-(T[x].nw?1:0)).slice(0,5).map(id=>T[id].n).join(", ");
function view(){const b=q("sd-box");b.replaceChildren();const sc=SD.sc.length?SD.sc:Array(18).fill(0),n=SD.n,f=fac(n),cnt=Array(18).fill(0);AC().forEach(t=>(t.sdg||[]).forEach(x=>cnt[x]++));
 b.append(el("b","🌍 Global Goals · UN Sustainable Development Goals"),el("small","Each goal is scored 0–100 from how well your city meets that need plus the buildings that support it (see the 🌍 Global Goals build tab). Reach 80 to achieve a goal: $5,000 once, and every goal you hold gives +1.2% income and +0.6% happiness. All 17 = Agenda 2030: $250,000 plus extra bonuses."));
 if(pop<1)b.append(el("small","Your city needs citizens before goals can be scored."));
 const top=el("div",null,"sd-top");
 [["Goals achieved",n+" / 17"],["Income bonus","+"+((f.i-1)*100).toFixed(1)+"%"],["Happiness bonus","+"+((f.h-1)*100).toFixed(1)+"%"],["Overall score",Math.round(sc.slice(1).reduce((a,v)=>a+v,0)/17)+" / 100"]].forEach(([l,v])=>{const d=el("div");d.append(el("small",l),el("b",v));top.append(d)});b.append(top);
 const gd=el("div",null,"sd-g");
 for(let k=1;k<=17;k++){const[nm,col]=GO[k-1],v=sc[k]||0,ok=v>=80,c=el("div",null,"sd-c"+(ok?" ok":""));c.style.borderLeftColor=col;
  const bar=el("div",null,"sd-bar"),u=el("u");u.style.width=v+"%";u.style.background=col;bar.append(u);
  c.append(el("b","SDG "+k+" · "+nm),bar,el("small",v+"/100 · "+(ok?"✅ Achieved":v>=60?"On track":v>=30?"Needs work":"Far behind")+" · supporting buildings: "+cnt[k]),el("small","Helps: "+help(k)));gd.append(c)}
 b.append(gd);const x=el("button","Close");x.onclick=()=>q("sd-m").classList.remove("on");b.append(x)}
bt.onclick=()=>{view();q("sd-m").classList.add("on")};
const anc=q("hbb")||q("lwb")||q("nwb");anc?anc.after(bt):document.querySelector("header").append(bt);lbl();
q("sd-m").onclick=e=>{if(e.target.id=="sd-m")e.target.classList.remove("on")};
addEventListener("keydown",e=>{if(e.key=="Escape")q("sd-m").classList.remove("on")});
/* tool info: show which goals a building supports */
const sel0=sel;sel=t=>{sel0(t);const o=T[t];if(o&&o.sdg&&o.sdg.length){let i=$("info").textContent;if(o.d&&!i.includes(o.d))i+=" "+o.d;$("info").textContent=i+" 🌍 Supports SDG "+o.sdg.join(", ")+" ("+o.sdg.map(k=>GO[k-1][0]).join(" · ")+")."}};
/* daily news line */
(window.DH=window.DH||[]).push((day,R,ev)=>{if(pop<1||!SD.sc.length)return;let w=1;for(let k=2;k<=17;k++)if(SD.sc[k]<SD.sc[w])w=k;
 ev.push("🌍 SDG report: "+SD.n+"/17 goals achieved. Biggest gap: SDG "+w+" "+GO[w-1][0]+" ("+SD.sc[w]+"/100).")});
/* new city resets progress */
const nw3=q("new").onclick;q("new").onclick=e=>{const r=!!e.target.dataset.s;nw3(e);if(r){SG={got:[],all:0};svg();SD={sc:[],n:0};lbl()}};
})();
